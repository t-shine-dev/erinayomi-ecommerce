{% comment %}Usage: {% include "components/testimonial_card.html" with name="..." role="..." quote="..." %}{% endcomment %}
<div class="bg-white/5 border border-white/10 rounded p-7 reveal">
  <div class="flex gap-1 mb-4 text-gold" aria-hidden="true">
    {% for i in "12345" %}<svg class="w-3.5 h-3.5 fill-gold" viewBox="0 0 20 20"><path d="M10 1.5l2.6 5.44 5.98.7-4.4 4.1 1.16 5.93L10 14.9l-5.34 2.77L5.82 11.7 1.42 7.6l5.98-.7z"/></svg>{% endfor %}
  </div>
  <p class="text-white/80 text-sm leading-relaxed mb-6">&ldquo;{{ quote }}&rdquo;</p>
  <div class="flex items-center gap-3">
    <span class="w-9 h-9 rounded-full bg-gold/20 border border-gold/40 flex items-center justify-center font-serif text-gold text-sm">{{ name|first }}</span>
    <div>
      <div class="text-sm font-medium">{{ name }}</div>
      <div class="text-xs text-white/40">{{ role }}</div>
    </div>
  </div>
</div>
