{% comment %}Usage: {% include "components/feature_item.html" with icon="gem" title="..." desc="..." %}{% endcomment %}
<div class="text-center reveal">
  <div class="w-14 h-14 mx-auto rounded-full bg-soft flex items-center justify-center mb-4 text-gold-dark">
    {% if icon == "gem" %}
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3h12l3 5-9 13L3 8l3-5z"/><path d="M3 8h18M9 3l3 5 3-5M12 8l-2.5 13M12 8l2.5 13"/></svg>
    {% elif icon == "truck" %}
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.5"/><circle cx="17.5" cy="18" r="1.5"/></svg>
    {% elif icon == "shield" %}
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    {% else %}
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.6 12.3L11.7 3.4a2 2 0 00-1.4-.6H4a1 1 0 00-1 1v6.3c0 .5.2 1 .6 1.4l8.9 8.9c.8.8 2 .8 2.8 0l5.3-5.3c.8-.8.8-2 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
    {% endif %}
  </div>
  <div class="font-serif text-lg mb-1">{{ title }}</div>
  <p class="text-sm text-gray-500 leading-relaxed">{{ desc }}</p>
</div>
