{% comment %}Usage: {% include "components/_tracker_step.html" with index=0 label="Confirmed" current=order.tracker_index %}{% endcomment %}
<div class="flex flex-col items-center gap-2 shrink-0">
  <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold
              {% if current >= index %}bg-gold text-charcoal{% else %}bg-gray-100 text-gray-400{% endif %}">
    {% if current > index %}
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
    {% else %}
    {{ index|add:1 }}
    {% endif %}
  </div>
  <span class="text-[10px] uppercase tracking-wide {% if current >= index %}text-charcoal font-medium{% else %}text-gray-400{% endif %}">{{ label }}</span>
</div>
