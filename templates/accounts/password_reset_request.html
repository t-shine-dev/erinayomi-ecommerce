{% extends "base.html" %}
{% block title %}Reset Password — ERINAYOMI{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 py-20">
  <div class="text-center mb-8 reveal">
    <div class="kicker justify-center mb-3">Support</div>
    <h1 class="font-serif text-3xl">Reset Password</h1>
    <p class="text-sm text-gray-500 mt-2">Enter your account email to receive a 6-digit verification code.</p>
  </div>
  <div class="card-surface p-8">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="field-label mb-1" for="email">Email Address</label>
        <input type="email" name="email" id="email" required 
               class="w-full h-11 px-3 border border-gray-300 rounded-md bg-white text-zinc-900">
      </div>
      <button type="submit" class="btn btn-primary w-full !py-3.5">Send Code</button>
    </form>
  </div>
  <div class="text-center mt-6">
    <p class="text-sm text-gray-500">
      Remember your password? <a href="{% url 'accounts:login' %}" class="text-gold-dark hover:underline">Log in</a>
    </p>
  </div>
</section>
{% endblock %}
