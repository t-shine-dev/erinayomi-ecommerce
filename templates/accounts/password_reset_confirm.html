{% extends "base.html" %}
{% block title %}New Password — ERINAYOMI{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 py-20">
  <div class="text-center mb-8 reveal">
    <div class="kicker justify-center mb-3">Secure Account</div>
    <h1 class="font-serif text-3xl">Set New Password</h1>
    <p class="text-sm text-gray-500 mt-2">Please choose a strong new password for your account.</p>
  </div>
  <div class="card-surface p-8">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="field-label mb-1" for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" required 
               class="w-full h-11 px-3 border border-gray-300 rounded-md bg-white text-zinc-900">
      </div>
      <div>
        <label class="field-label mb-1" for="confirm_password">Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirm_password" required 
               class="w-full h-11 px-3 border border-gray-300 rounded-md bg-white text-zinc-900">
      </div>
      <button type="submit" class="btn btn-primary w-full !py-3.5">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
