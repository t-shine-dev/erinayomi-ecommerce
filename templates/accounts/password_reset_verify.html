{% extends "base.html" %}
{% block title %}Verify Code — ERINAYOMI{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 py-20">
  <div class="text-center mb-8 reveal">
    <div class="kicker justify-center mb-3">Security Check</div>
    <h1 class="font-serif text-3xl">Enter Verification Code</h1>
    <p class="text-sm text-gray-500 mt-2">Please enter the 6-digit code sent to your email.</p>
  </div>
  <div class="card-surface p-8">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="field-label mb-1" for="otp_code">6-Digit Code</label>
        <input type="text" name="otp_code" id="otp_code" maxlength="6" required 
               class="w-full h-11 px-3 text-center tracking-widest text-lg border border-gray-300 rounded-md bg-white text-zinc-900">
      </div>
      <button type="submit" class="btn btn-primary w-full !py-3.5">Verify Code</button>
    </form>
  </div>
</section>
{% endblock %}
