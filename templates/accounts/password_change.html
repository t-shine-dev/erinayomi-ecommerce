{% extends "base.html" %}
{% block content %}
<section class="max-w-xl mx-auto px-4 sm:px-6 py-14">
  <div class="kicker mb-3">My Account</div>
  <h1 class="font-serif text-3xl mb-10 text-white">Change Password</h1>

  <div class="card-surface p-7 mb-6 text-zinc-900">
    <form method="post" data-loading-submit class="space-y-4">
      {% csrf_token %}
      
      {% for field in form %}
        <div>
          <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}
            <div class="text-xs text-zinc-600 mt-1 space-y-1">{{ field.help_text|safe }}</div>
          {% endif %}
          {% if field.errors %}
            <div class="field-error">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit" data-submit-btn data-loading-text="Changing Password…" class="btn btn-primary mt-4">Update Password</button>
    </form>
  </div>
</section>
{% endblock %}
